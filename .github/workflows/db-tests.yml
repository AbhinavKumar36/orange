name: Database Tests & Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    name: Supabase Migrations & pgTAP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify Docker Daemon
        run: |
          sudo systemctl start docker || true
          docker version

      - name: Start Database
        run: |
          supabase start -x studio -x realtime -x storage-api -x imgproxy -x inbucket -x edge-runtime || supabase db start

      - name: Execute pgTAP Database Tests
        run: supabase test db

      - name: Stop Database
        if: always()
        run: supabase stop --no-backup

      - name: Diagnostic on Failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs $(docker ps -q -l) || true
