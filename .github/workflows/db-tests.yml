name: Database Tests & Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    name: Supabase Migrations & pgTAP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Database
        run: supabase start --debug --exclude studio,realtime,storage-api,imgproxy,inbucket,edge-runtime

      - name: Execute pgTAP Database Tests
        run: supabase test db --debug

      - name: Stop Database
        if: always()
        run: supabase stop --no-backup
