name: Database Tests & Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    name: Supabase Migrations & pgTAP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Adjust permissions
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        id: start_supabase
        run: |
          supabase start --debug 2>&1 | tee /tmp/supabase_start.log

      - name: Save Diagnostic to Summary
        if: always()
        run: |
          echo "## Supabase Start Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat /tmp/supabase_start.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          LOG_CONTENT=$(head -c 2000 /tmp/supabase_start.log | tr '\n' ' ' | tr '"' "'")
          echo "::error title=SupabaseStartLog::$LOG_CONTENT"

      - name: Execute pgTAP Database Tests
        run: supabase test db

      - name: Stop Database
        if: always()
        run: supabase stop --no-backup
