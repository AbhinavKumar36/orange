name: Database Tests & Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    name: Supabase Migrations & pgTAP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Adjust permissions
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Execute pgTAP Database Tests
        run: |
          supabase test db 2>&1 | tee /tmp/supabase_test.log

      - name: Report Test Results
        if: always()
        run: |
          echo "## pgTAP Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat /tmp/supabase_test.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          TEST_LOG=$(tail -n 25 /tmp/supabase_test.log | tr '\n' ' ' | tr '"' "'")
          echo "::notice title=pgTAPResults::$TEST_LOG"

      - name: Stop Database
        if: always()
        run: supabase stop --no-backup
