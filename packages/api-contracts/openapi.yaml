        productId:
          type: string
          format: uuid
        productName:
          type: string
        productSlug:
          type: string
        categoryName:
          type: string
        physicalStock:
          type: integer
          minimum: 0
        reservedStock:
          type: integer
          minimum: 0
        availableStock:
          type: integer
        lowStockThreshold:
          type: integer
          minimum: 0
        isLowStock:
          type: boolean
        lastRestockedAt:
          type: [string, "null"]
          format: date-time
      required:
        - productId
        - productName
        - productSlug
        - categoryName
        - physicalStock
        - reservedStock
        - availableStock
        - lowStockThreshold
        - isLowStock
      additionalProperties: false
    AdminInventoryListResponse:
      type: object
      properties:
        inventory:
          type: array
