openapi: 3.1.0
info:
  title: Moody Orange API
  description: >-
    Authoritative REST API specification for Moody Orange boutique quick-commerce
    ordering platform.
  version: 1.0.0
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /api/v1
    description: Current API version root
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories:
    get:
      summary: List active product categories
      description: Returns all active menu categories ordered by display order.
      operationId: getCategories
      security: []
      responses:
        '200':
          description: List of active categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    get:
      summary: List active products
      description: Returns active menu products with informational availability status.
      operationId: getProducts
      security: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filter products by category UUID
          schema:
            type: string
            format: uuid
        - name: category_slug
          in: query
          required: false
          description: Filter products by category slug
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Case-insensitive search across product title and description
          schema:
            type: string
      responses:
        '200':
          description: List of matching active products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{idOrSlug}:
    get:
      summary: Get product details
      description: Retrieve complete details for a single product by UUID or slug.
      operationId: getProductByIdOrSlug
      security: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          description: Product UUID or slug identifier
          schema:
            type: string
      responses:
        '200':
          description: Product details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    MoneyInPaise:
      type: integer
      minimum: 0
      description: Monetary amount in integer INR paise (e.g. 65000 paise = 650.00 INR). Floating-point currency is prohibited.
      example: 65000
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
      required:
        - status
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          example: Artisanal Cakes
        slug:
          type: string
          example: artisanal-cakes
        description:
          type: [string, "null"]
          example: Freshly baked boutique gourmet cakes
        display_order:
          type: integer
          example: 1
      required:
        - id
        - name
        - slug
        - display_order
      additionalProperties: false
    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - categories
      additionalProperties: false
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
        categoryId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        categoryName:
          type: string
          example: Artisanal Cakes
        categorySlug:
          type: string
          example: artisanal-cakes
        name:
          type: string
          example: Dark Chocolate Truffle Cake (500g)
        slug:
          type: string
          example: dark-chocolate-truffle-cake-500g
        description:
          type: [string, "null"]
          example: 70% Belgian dark chocolate sponge with silky ganache
        basePrice:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRatePct:
          type: number
          example: 5.0
        isVeg:
          type: boolean
          example: true
        allergens:
          type: array
          items:
            type: string
          example: [dairy, gluten]
        prepTimeMinutes:
          type: integer
          example: 20
        imageUrl:
          type: [string, "null"]
          example: null
        isInStock:
          type: boolean
          example: true
      required:
        - id
        - categoryId
        - categoryName
        - categorySlug
        - name
        - slug
        - basePrice
        - taxRatePct
        - isVeg
        - allergens
        - prepTimeMinutes
        - isInStock
      additionalProperties: false
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
        - products
      additionalProperties: false
    ProductDetailResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
      required:
        - product
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            statusCode:
              type: integer
              example: 500
            code:
              type: string
              example: INTERNAL_SERVER_ERROR
            message:
              type: string
              example: An error occurred
          required:
            - statusCode
            - code
            - message
      required:
        - error
      additionalProperties: false
