        allergens:
          type: array
          items:
            type: string
        prepTimeMinutes:
          type: integer
        imageUrl:
          type: [string, "null"]
        isActive:
          type: boolean
      additionalProperties: false
    AdminCategoryItem:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            isActive:
              type: boolean
            productCount:
              type: integer
              minimum: 0
          required:
            - isActive
            - productCount
    AdminCategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategoryItem'
      required:
