openapi: 3.1.0
info:
  title: Moody Orange API
  description: >-
    Authoritative REST API specification for Moody Orange boutique quick-commerce
    ordering platform.
  version: 1.0.0
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /api/v1
    description: Current API version root
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profile:
    get:
      summary: Get customer profile
      description: Retrieve the authenticated customer's profile.
      operationId: getCustomerProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update customer profile
      description: Update the authenticated customer's profile details.
      operationId: updateCustomerProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Customer profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/validate-cart:
    post:
      summary: Validate cart prices and stock
      description: Validates current catalog prices, taxes, and stock availability for a given cart.
      operationId: validateCart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCartRequest'
      responses:
        '200':
          description: Cart validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCartResponse'
        '400':
          description: Invalid cart request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/checkout:
    post:
      summary: Create order and reserve stock
      description: Creates an order transactionally and reserves physical inventory.
      operationId: checkoutOrder
      security:
        - bearerAuth: []
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          description: Customer-scoped idempotency key for preventing duplicate orders
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created and stock reserved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Validation error or invalid cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict (key reused with mismatched payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient stock or unfulfillable request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders:
    get:
      summary: List customer orders
      description: Retrieve orders placed by the authenticated customer.
      operationId: getCustomerOrders
      security:
        - bearerAuth: []
      responses:
        '200':
