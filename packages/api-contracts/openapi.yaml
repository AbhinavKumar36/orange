    AdminInventoryWriteOffRequest:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        damagedQuantity:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
        - productId
        - damagedQuantity
