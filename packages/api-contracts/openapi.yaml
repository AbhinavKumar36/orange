openapi: 3.1.0
info:
  title: Moody Orange API
  description: >-
    Authoritative REST API specification for Moody Orange boutique quick-commerce
    ordering platform.
  version: 1.0.0
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /api/v1
    description: Current API version root
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories:
    get:
      summary: List active product categories
      description: Returns all active menu categories ordered by display order.
      operationId: getCategories
      security: []
      responses:
        '200':
          description: List of active categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    get:
      summary: List active products
      description: Returns active menu products with informational availability status.
      operationId: getProducts
      security: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filter products by category UUID
          schema:
            type: string
            format: uuid
        - name: category_slug
          in: query
          required: false
          description: Filter products by category slug
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Case-insensitive search across product title and description
          schema:
            type: string
      responses:
        '200':
          description: List of matching active products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{idOrSlug}:
    get:
      summary: Get product details
      description: Retrieve complete details for a single product by UUID or slug.
      operationId: getProductByIdOrSlug
      security: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          description: Product UUID or slug identifier
          schema:
            type: string
      responses:
        '200':
          description: Product details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profile:
    get:
      summary: Get customer profile
      description: Retrieve the authenticated customer profile.
      operationId: getCustomerProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update customer profile
      description: Update the authenticated customer profile details.
      operationId: updateCustomerProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Customer profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/validate-cart:
    post:
      summary: Validate cart prices and stock
      description: Validates current catalog prices, taxes, and stock availability for a given cart.
      operationId: validateCart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCartRequest'
      responses:
        '200':
          description: Cart validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCartResponse'
        '400':
          description: Invalid cart request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/checkout:
    post:
      summary: Create order and reserve stock
      description: Creates an order transactionally and reserves physical inventory.
      operationId: checkoutOrder
      security:
        - bearerAuth: []
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          description: Customer-scoped idempotency key for preventing duplicate orders (alphanumeric, dash, underscore, max 128 chars)
          schema:
            type: string
            maxLength: 128
            pattern: '^[a-zA-Z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created and stock reserved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Validation error or invalid cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict (key reused with mismatched payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient stock or unfulfillable request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders:
    get:
      summary: List customer orders
      description: Retrieve orders placed by the authenticated customer.
      operationId: getCustomerOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of customer orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{id}:
    get:
      summary: Get order details by ID
      description: Retrieve details and items for an order owned by the authenticated customer.
      operationId: getCustomerOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Order belongs to another customer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/me:
    get:
      summary: Get current authenticated staff profile
      description: Returns the authenticated staff member's profile and verified server-assigned role.
      operationId: getAdminMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Not a staff member).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/dashboard:
    get:
      summary: Get business overview and operational KPIs
      description: Authoritative business statistics calculated from the database.
      operationId: getAdminDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/products:
    get:
      summary: List all products with stock and status
      description: Returns products with physical, reserved, and available stock.
      operationId: getAdminProducts
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of admin products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new product
      description: Creates a product and initializes its inventory. Requires manager or admin role.
      operationId: createAdminProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreateRequest'
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductItem'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Requires manager or admin role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/products/{id}:
    put:
      summary: Update product details
      description: Updates product metadata, price, allergens, and availability. Requires manager or admin.
      operationId: updateAdminProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductUpdateRequest'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductItem'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/products/{id}/status:
    patch:
      summary: Toggle product publication status
      description: Publishes or archives a product. Requires manager or admin.
      operationId: updateAdminProductStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductItem'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/categories:
    get:
      summary: List all categories with product counts
      description: Returns categories for catalog management.
      operationId: getAdminCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categories list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new category
      description: Requires manager or admin role.
      operationId: createAdminCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryCreateRequest'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryItem'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/categories/{id}:
    put:
      summary: Update category details
      description: Requires manager or admin role.
      operationId: updateAdminCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryUpdateRequest'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryItem'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete or archive category
      description: Safely deletes category if no products are assigned. Requires manager or admin role.
      operationId: deleteAdminCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Category cannot be deleted because it contains products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/orders:
    get:
      summary: Browse and filter orders
      description: View orders queue for kitchen prep and counter pickup.
      operationId: getAdminOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/orders/{id}:
    get:
      summary: Get order details by ID for staff
      description: Staff order detail view with items, customer name, and payment status.
      operationId: getAdminOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/orders/{id}/status:
    patch:
      summary: Update order status transition
      description: Validates permitted lifecycle transitions.
      operationId: updateAdminOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderStatusUpdateRequest'
      responses:
        '200':
          description: Order status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          description: Invalid transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/orders/{id}/handover:
    post:
      summary: Complete counter order handover
      description: Enforces staff cash receipt confirmation for cash orders; decrements stock atomically.
      operationId: completeAdminOrderHandover
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderHandoverRequest'
      responses:
        '200':
          description: Handover completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          description: Handover requirement not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Order already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/orders/{id}/cancel:
    post:
      summary: Cancel order by staff
      description: Cancels order and releases reserved stock. Requires manager or admin.
      operationId: cancelAdminOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderCancelRequest'
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          description: Invalid cancellation request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Requires manager or admin role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/inventory:
    get:
      summary: Get inventory levels across all products
      description: Returns physical, reserved, available stock, and low stock indicators.
      operationId: getAdminInventory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInventoryListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/inventory/write-off:
    post:
      summary: Protected inventory write-off
      description: Defends physical_stock >= reserved_stock constraint. Blocked if damage exceeds unreserved stock. Requires manager or admin.
      operationId: writeOffAdminInventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInventoryWriteOffRequest'
      responses:
        '200':
          description: Write-off completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  physicalStock:
                    type: integer
                  reservedStock:
                    type: integer
                  availableStock:
                    type: integer
                required:
                  - physicalStock
                  - reservedStock
                  - availableStock
        '400':
          description: Invalid write-off parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Requires manager or admin role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Write-off blocked because damaged units are reserved by active orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/inventory/adjust:
    post:
      summary: Safe stock adjustment
      description: Reconcile or restock physical inventory. Requires manager or admin role.
      operationId: adjustAdminInventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInventoryAdjustRequest'
      responses:
        '200':
          description: Stock adjusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInventoryItem'
        '400':
          description: Invalid adjustment resulting in negative stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT access token
  schemas:
    MoneyInPaise:
      type: integer
      minimum: 0
      description: Monetary amount in integer INR paise (e.g. 65000 paise = 650.00 INR). Floating-point currency is prohibited.
      example: 65000
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
      required:
        - status
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          example: Artisanal Cakes
        slug:
          type: string
          example: artisanal-cakes
        description:
          type: [string, "null"]
          example: Freshly baked boutique gourmet cakes
        display_order:
          type: integer
          example: 1
      required:
        - id
        - name
        - slug
        - display_order
      additionalProperties: false
    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - categories
      additionalProperties: false
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
        categoryId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        categoryName:
          type: string
          example: Artisanal Cakes
        categorySlug:
          type: string
          example: artisanal-cakes
        name:
          type: string
          example: Dark Chocolate Truffle Cake (500g)
        slug:
          type: string
          example: dark-chocolate-truffle-cake-500g
        description:
          type: [string, "null"]
          example: 70% Belgian dark chocolate sponge with silky ganache
        basePrice:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRatePct:
          type: number
          example: 5.0
        isVeg:
          type: boolean
          example: true
        allergens:
          type: array
          items:
            type: string
          example: [dairy, gluten]
        prepTimeMinutes:
          type: integer
          example: 20
        imageUrl:
          type: [string, "null"]
          example: null
        isInStock:
          type: boolean
          example: true
      required:
        - id
        - categoryId
        - categoryName
        - categorySlug
        - name
        - slug
        - basePrice
        - taxRatePct
        - isVeg
        - allergens
        - prepTimeMinutes
        - isInStock
      additionalProperties: false
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
        - products
      additionalProperties: false
    ProductDetailResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
      required:
        - product
      additionalProperties: false
    CartItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 2
      required:
        - productId
        - quantity
      additionalProperties: false
    CartValidationItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        basePrice:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRatePct:
          type: number
        quantity:
          type: integer
        lineTotal:
          $ref: '#/components/schemas/MoneyInPaise'
        isInStock:
          type: boolean
        availableStock:
          type: integer
      required:
        - productId
        - productName
        - basePrice
        - taxRatePct
        - quantity
        - lineTotal
        - isInStock
      additionalProperties: false
    ValidateCartRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItem'
      required:
        - items
      additionalProperties: false
    ValidateCartResponse:
      type: object
      properties:
        isValid:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartValidationItem'
        subtotalAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        taxAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        packagingAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        totalAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        hasOutOfStockItems:
          type: boolean
      required:
        - isValid
        - items
        - subtotalAmount
        - taxAmount
        - packagingAmount
        - totalAmount
        - hasOutOfStockItems
      additionalProperties: false
    CheckoutRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItem'
        fulfillment:
          type: string
          enum: [immediate, scheduled]
          default: immediate
        scheduledPickupAt:
          type: [string, "null"]
          format: date-time
        paymentMethod:
          type: string
          enum: [online_razorpay, cash_at_pickup]
        customerName:
          type: string
          minLength: 1
          maxLength: 100
        customerPhone:
          type: string
          minLength: 10
          maxLength: 20
        specialNotes:
          type: string
          maxLength: 500
      required:
        - items
        - paymentMethod
        - customerName
        - customerPhone
      additionalProperties: false
    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        orderStatus:
          type: string
          enum:
            - draft
            - confirmed
            - preparing
            - ready_for_pickup
            - completed
            - cancelled_expired
            - cancelled_by_customer
            - cancelled_by_staff
            - cancelled_damaged_stock
            - cancelled_inventory_depleted
            - cancelled_uncollected
        paymentStatus:
          type: string
          enum:
            - unpaid
            - pending
            - authorized
            - captured
            - failed
            - refund_pending
            - refund_processing
            - partially_refunded
            - refunded
            - refund_failed
        totalAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        currency:
          type: string
          enum: [INR]
          default: INR
        expiresAt:
          type: [string, "null"]
          format: date-time
        estimatedPickupAt:
          type: [string, "null"]
          format: date-time
      required:
        - orderId
        - orderNumber
        - orderStatus
        - paymentStatus
        - totalAmount
        - currency
      additionalProperties: false
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productNameSnapshot:
          type: string
        unitPriceSnapshot:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRateSnapshot:
          type: number
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/MoneyInPaise'
      required:
        - id
        - productId
        - productNameSnapshot
        - unitPriceSnapshot
        - taxRateSnapshot
        - quantity
        - lineTotal
      additionalProperties: false
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        customerId:
          type: string
          format: uuid
        customerPhone:
          type: string
        customerName:
          type: string
        fulfillmentType:
          type: string
          enum: [immediate, scheduled]
        scheduledPickupAt:
          type: [string, "null"]
          format: date-time
        estimatedPickupAt:
          type: string
          format: date-time
        orderStatus:
          type: string
        paymentStatus:
          type: string
        paymentMethod:
          type: string
          enum: [online_razorpay, cash_at_pickup]
        subtotalAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        taxAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        packagingAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        totalAmount:
          $ref: '#/components/schemas/MoneyInPaise'
        specialNotes:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
        - id
        - orderNumber
        - customerId
        - customerPhone
        - customerName
        - fulfillmentType
        - estimatedPickupAt
        - orderStatus
        - paymentStatus
        - paymentMethod
        - subtotalAmount
        - taxAmount
        - packagingAmount
        - totalAmount
        - createdAt
      additionalProperties: false
    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
        - orders
      additionalProperties: false
    OrderDetailResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
      required:
        - order
      additionalProperties: false
    CustomerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        fullName:
          type: [string, "null"]
        email:
          type: [string, "null"]
      required:
        - id
        - phone
      additionalProperties: false
    CustomerProfileResponse:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/CustomerProfile'
      required:
        - profile
      additionalProperties: false
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - fullName
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            statusCode:
              type: integer
              example: 500
            code:
              type: string
              example: INTERNAL_SERVER_ERROR
            message:
              type: string
              example: An error occurred
          required:
            - statusCode
            - code
            - message
      required:
        - error
      additionalProperties: false
    OrderStatus:
      type: string
      enum:
        - draft
        - confirmed
        - preparing
        - ready_for_pickup
        - completed
        - cancelled_expired
        - cancelled_by_customer
        - cancelled_by_staff
        - cancelled_damaged_stock
        - cancelled_inventory_depleted
        - cancelled_uncollected
    PaymentStatus:
      type: string
      enum:
        - unpaid
        - pending
        - authorized
        - captured
        - failed
        - refund_pending
        - refund_processing
        - partially_refunded
        - refunded
        - refund_failed
    StaffRole:
      type: string
      enum:
        - counter_staff
        - manager
        - admin
    AdminStaffProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: [string, "null"]
        fullName:
          type: [string, "null"]
        email:
          type: [string, "null"]
        role:
          $ref: '#/components/schemas/StaffRole'
      required:
        - id
        - role
      additionalProperties: false
    AdminMeResponse:
      type: object
      properties:
        staff:
          $ref: '#/components/schemas/AdminStaffProfile'
      required:
        - staff
      additionalProperties: false
    DashboardMetrics:
      type: object
      properties:
        totalOrders:
          type: integer
          minimum: 0
        ordersAwaitingProcessing:
          type: integer
          minimum: 0
        ordersReadyForPickup:
          type: integer
          minimum: 0
        completedOrders:
          type: integer
          minimum: 0
        grossSalesPaise:
          $ref: '#/components/schemas/MoneyInPaise'
        activeProducts:
          type: integer
          minimum: 0
        lowStockProducts:
          type: integer
          minimum: 0
        recentOrders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              orderNumber:
                type: string
              customerName:
                type: string
              totalAmount:
                $ref: '#/components/schemas/MoneyInPaise'
              orderStatus:
                $ref: '#/components/schemas/OrderStatus'
              paymentStatus:
                $ref: '#/components/schemas/PaymentStatus'
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - orderNumber
              - customerName
              - totalAmount
              - orderStatus
              - paymentStatus
              - createdAt
        lowStockAlerts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              physicalStock:
                type: integer
              reservedStock:
                type: integer
              availableStock:
                type: integer
              lowStockThreshold:
                type: integer
            required:
              - id
              - name
              - physicalStock
              - reservedStock
              - availableStock
              - lowStockThreshold
      required:
        - totalOrders
        - ordersAwaitingProcessing
        - ordersReadyForPickup
        - completedOrders
        - grossSalesPaise
        - activeProducts
        - lowStockProducts
        - recentOrders
        - lowStockAlerts
      additionalProperties: false
    AdminProductItem:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            isActive:
              type: boolean
            physicalStock:
              type: integer
              minimum: 0
            reservedStock:
              type: integer
              minimum: 0
            availableStock:
              type: integer
            lowStockThreshold:
              type: integer
              minimum: 0
          required:
            - isActive
            - physicalStock
            - reservedStock
            - availableStock
            - lowStockThreshold
    AdminProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductItem'
      required:
        - products
      additionalProperties: false
    AdminProductCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        description:
          type: [string, "null"]
        basePrice:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRatePct:
          type: number
          default: 5.0
        isVeg:
          type: boolean
          default: true
        allergens:
          type: array
          items:
            type: string
        prepTimeMinutes:
          type: integer
          default: 15
        imageUrl:
          type: [string, "null"]
        initialStock:
          type: integer
          minimum: 0
          default: 10
        lowStockThreshold:
          type: integer
          minimum: 0
          default: 5
        isActive:
          type: boolean
          default: true
      required:
        - name
        - slug
        - categoryId
        - basePrice
      additionalProperties: false
    AdminProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        categoryId:
          type: string
          format: uuid
        description:
          type: [string, "null"]
        basePrice:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRatePct:
          type: number
        isVeg:
