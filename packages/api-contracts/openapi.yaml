      additionalProperties: false
    AdminCategoryCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, "null"]
        display_order:
          type: integer
          default: 0
      required:
        - name
        - slug
      additionalProperties: false
    AdminCategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
