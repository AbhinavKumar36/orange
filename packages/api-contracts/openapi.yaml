components:
  schemas:
    MoneyInPaise:
      type: integer
      minimum: 0
      description: Monetary amount in integer INR paise (e.g. 65000 paise = 650.00 INR). Floating-point currency is prohibited.
      example: 65000
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
      required:
        - status
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          example: Artisanal Cakes
        slug:
          type: string
          example: artisanal-cakes
        description:
          type: [string, "null"]
          example: Freshly baked boutique gourmet cakes
        display_order:
          type: integer
          example: 1
      required:
        - id
        - name
        - slug
        - display_order
      additionalProperties: false
    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - categories
      additionalProperties: false
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
        categoryId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        categoryName:
          type: string
          example: Artisanal Cakes
        categorySlug:
          type: string
          example: artisanal-cakes
        name:
          type: string
          example: Dark Chocolate Truffle Cake (500g)
        slug:
          type: string
          example: dark-chocolate-truffle-cake-500g
        description:
          type: [string, "null"]
          example: 70% Belgian dark chocolate sponge with silky ganache
        basePrice:
          $ref: '#/components/schemas/MoneyInPaise'
        taxRatePct:
          type: number
          example: 5.0
        isVeg:
          type: boolean
          example: true
        allergens:
          type: array
          items:
            type: string
          example: [dairy, gluten]
        prepTimeMinutes:
          type: integer
          example: 20
        imageUrl:
          type: [string, "null"]
          example: null
        isInStock:
          type: boolean
          example: true
      required:
        - id
        - categoryId
        - categoryName
        - categorySlug
        - name
        - slug
        - basePrice
        - taxRatePct
        - isVeg
        - allergens
        - prepTimeMinutes
        - isInStock
      additionalProperties: false
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
        - products
      additionalProperties: false
    ProductDetailResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
      required:
        - product
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            statusCode:
              type: integer
              example: 500
            code:
              type: string
              example: INTERNAL_SERVER_ERROR
            message:
              type: string
              example: An error occurred
          required:
            - statusCode
            - code
            - message
      required:
        - error
      additionalProperties: false
