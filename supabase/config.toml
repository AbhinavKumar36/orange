# Moody Orange — Supabase Local Development Configuration
project_id = "orange"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Moody Orange verification code is {{ .Code }}"

# Development-only fixed test OTPs for local testing without real SMS delivery or paid SMS credits.
# Reference: https://supabase.com/docs/guides/auth/testing-auth-flows
# Format: "+<country_code><number>" = "<code>"
[auth.sms.test_otp]
"+919876543210" = "123456"
"9876543210" = "123456"
"+919876500001" = "111111"
"+919876500002" = "222222"


